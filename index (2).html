<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المذاكرة والإنجاز اليومي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2e7d32;
            --primary-hover: #1b5e20;
            --card-bg: rgba(255, 255, 255, 0.94);
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border-color: #cbd5e1;
            --completed-bg: #e8f5e9;
            --completed-border: #4caf50;
            --today-color: #d97706;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* 🌈 خلفية متدرجة ومتحركة */
        body {
            background: linear-gradient(-45deg, #0f172a, #1e3a8a, #064e3b, #1e1b4b);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 🔐 شاشة تسجيل الدخول / إنشاء الحساب */
        .auth-container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
        }

        .auth-header h2 {
            font-size: 24px;
            color: #0f172a;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .auth-header p {
            color: var(--text-sub);
            font-size: 13px;
            margin-bottom: 25px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .auth-form input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }

        .auth-form input:focus {
            border-color: var(--primary-color);
        }

        .auth-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .auth-btn:hover {
            background-color: var(--primary-hover);
        }

        .auth-toggle {
            margin-top: 18px;
            font-size: 13px;
            color: var(--text-sub);
        }

        .auth-toggle span {
            color: #2563eb;
            font-weight: 700;
            cursor: pointer;
            text-decoration: underline;
        }

        /* 📚 شاشة المنصة الرئيسية */
        .app-container {
            width: 100%;
            max-width: 820px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: none; /* إخفاء المنصة حتى يتم تسجيل الدخول */
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(241, 245, 249, 0.8);
            padding: 10px 16px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 13px;
            font-weight: 700;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
        }

        .header {
            text-align: center;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .header h2 {
            font-size: 26px;
            color: #0f172a;
            font-weight: 800;
        }

        /* 💡 بطاقة النصيحة اليومية */
        .daily-advice-card {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            border: 1px solid #f59e0b;
            padding: 14px 18px;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(245, 158, 11, 0.15);
        }

        .daily-advice-card h4 {
            color: #b45309;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .daily-advice-card p {
            color: #78350f;
            font-size: 13.5px;
            font-weight: 700;
            line-height: 1.5;
        }

        .days-nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 5px;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .day-btn {
            background: #f1f5f9;
            border: 1.5px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-size: 13px;
        }

        .day-btn:hover { background: #e2e8f0; }

        .day-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .day-btn.is-today { border: 2px solid var(--today-color); }

        .day-btn .badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 6px;
            background: rgba(0,0,0,0.08);
        }

        .day-btn.active .badge { background: rgba(255,255,255,0.2); }
        .day-btn.completed-day .badge { color: #27ae60; font-weight: 800; }
        .day-btn.active.completed-day .badge { color: #fff; }

        .view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .status-tag {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        .tag-today { background: #fef3c7; color: #b45309; }
        .tag-normal { background: #e2e8f0; color: #475569; }

        .btn-edit-schedule {
            background-color: #64748b;
            color: white;
            padding: 6px 14px;
            font-size: 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .progress-bar-container {
            background-color: #e2e8f0;
            border-radius: 10px;
            height: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #10b981, #059669);
            transition: width 0.4s ease;
        }

        .subject-card {
            background: #ffffff;
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s;
        }

        .subject-card.completed {
            background-color: var(--completed-bg);
            border-color: var(--completed-border);
        }

        .subject-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .inputs-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 10px 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .btn {
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .finish-btn { background-color: #2563eb; color: white; }
        .edit-btn { background-color: #f59e0b; color: white; }

        .time-badge {
            font-size: 11px;
            color: var(--text-sub);
            margin-top: 6px;
            font-weight: 600;
        }

        .submit-section {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 2px dashed var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .submit-all-btn {
            background-color: var(--primary-color);
            color: white;
            font-size: 15px;
            padding: 14px 20px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.25);
        }

        .sheet-btn {
            background-color: #0284c7;
            color: white;
            font-size: 15px;
            padding: 14px 20px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
        }

        .sheet-btn:hover { background-color: #0369a1; }

        /* 📊 شاشات Modals (تعديل الحصص وشيت البيانات الداخلي) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            padding: 25px;
            border-radius: 16px;
            width: 90%;
            max-width: 700px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
        }

        .edit-subject-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        .btn-add {
            background: #10b981;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
        }

        /* 📑 تصميم جدول شيت المهام المسلمة الداخلي */
        .sheet-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }

        .sheet-table th, .sheet-table td {
            border: 1px solid #cbd5e1;
            padding: 10px;
            text-align: center;
        }

        .sheet-table th {
            background-color: #f1f5f9;
            color: #0f172a;
            font-weight: 800;
        }

        .sheet-table tr:nth-child(even) {
            background-color: #f8fafc;
        }
    </style>
</head>
<body>

<!-- 🔐 1. صفحة تسجيل الدخول / إنشاء الحساب -->
<div class="auth-container" id="auth-container">
    <div class="auth-header">
        <h2 id="auth-title">تسجيل الدخول</h2>
        <p id="auth-subtitle">أدخل بياناتك للمتابعة إلى منصة المذاكرة</p>
    </div>

    <form class="auth-form" id="auth-form" onsubmit="handleAuth(event)">
        <input type="text" id="auth-name" placeholder="الاسم الكامل" style="display: none;">
        <input type="email" id="auth-email" placeholder="البريد الإلكتروني" required>
        <input type="password" id="auth-pass" placeholder="كلمة السر" required>
        <button type="submit" class="auth-btn" id="auth-submit-btn">دخول 🚀</button>
    </form>

    <div class="auth-toggle">
        <span id="auth-toggle-text" onclick="toggleAuthMode()">ليس لديك حساب؟ إنشاء حساب جديد</span>
    </div>
</div>

<!-- 📚 2. الصفحة الرئيسية للتطبيق -->
<div class="app-container" id="app-container">
    <div class="user-bar">
        <span>👋 مرحباً بك، <span id="user-display-name">المستخدم</span></span>
        <button class="logout-btn" onclick="logout()">تسجيل الخروج 🚪</button>
    </div>

    <div class="header">
        <h2>📚 منصة المذاكرة والإنجاز اليومي</h2>
    </div>

    <!-- 💡 بطاقة النصيحة اليومية -->
    <div class="daily-advice-card">
        <h4>💡 نصيحة المذاكرة اليومية:</h4>
        <p id="daily-advice-text">جاري تحميل نصيحة اليوم...</p>
    </div>

    <!-- شريط الأيام -->
    <div class="days-nav" id="days-nav"></div>

    <div class="view-header">
        <div>
            <h3 id="selected-day-title" style="display:inline;">جدول اليوم</h3>
            <span id="day-status-tag" class="status-tag"></span>
        </div>
        <button class="btn-edit-schedule" onclick="openScheduleModal()">⚙️ تعديل حصص هذا اليوم</button>
    </div>

    <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div id="subjects-container"></div>

    <div class="submit-section">
        <button class="btn submit-all-btn" id="submit-all-btn" onclick="submitSelectedDayTasks()">
            🚀 تسليم مهام اليوم وحفظها في الشيت
        </button>
        <button class="btn sheet-btn" onclick="openInternalSheetModal()">
            📊 عرض شيت المهام المسلّمة (سجل الإنجازات)
        </button>
    </div>
</div>

<!-- ⚙️ نافذة تعديل الحصص Modal -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modal-title">تعديل مواد يوم</h3>
            <button onclick="closeScheduleModal()" style="border:none; background:none; font-size:20px; cursor:pointer;">✕</button>
        </div>
        <div id="modal-subjects-list"></div>
        <button class="btn-add" onclick="addNewSubjectRow()">+ إضافة مادة جديدة</button>
        <button class="btn submit-all-btn" style="margin-top: 15px;" onclick="saveCustomSchedule()">حفظ التعديلات</button>
    </div>
</div>

<!-- 📊 نافذة شيت البيانات الداخلي Modal -->
<div class="modal-overlay" id="sheet-modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3>📑 شيت المهام والإنجازات المسلّمة</h3>
            <button onclick="closeInternalSheetModal()" style="border:none; background:none; font-size:20px; cursor:pointer;">✕</button>
        </div>
        <div id="sheet-table-container">
            <!-- سيتم توليد جدول الشيت هنا -->
        </div>
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="btn" style="background:#ef4444; color:white; flex:1;" onclick="clearSheetHistory()">تفريغ السجل 🗑️</button>
            <button class="btn" style="background:#64748b; color:white; flex:1;" onclick="closeInternalSheetModal()">إغلاق الشيت</button>
        </div>
    </div>
</div>

<script>
    // --- 🔑 نظام تسجيل الدخول وإنشاء الحساب ---
    let isSignUpMode = false;

    function checkAuthStatus() {
        const currentUser = JSON.parse(localStorage.getItem("current_user"));
        if (currentUser) {
            document.getElementById("auth-container").style.display = "none";
            document.getElementById("app-container").style.display = "block";
            document.getElementById("user-display-name").innerText = currentUser.name || currentUser.email;
            initApp();
        } else {
            document.getElementById("auth-container").style.display = "block";
            document.getElementById("app-container").style.display = "none";
        }
    }

    function toggleAuthMode() {
        isSignUpMode = !isSignUpMode;
        const nameInput = document.getElementById("auth-name");
        const title = document.getElementById("auth-title");
        const subtitle = document.getElementById("auth-subtitle");
        const submitBtn = document.getElementById("auth-submit-btn");
        const toggleText = document.getElementById("auth-toggle-text");

        if (isSignUpMode) {
            title.innerText = "إنشاء حساب جديد";
            subtitle.innerText = "أنشئ حسابك لتتبع جدولك وإنجازاتك الدراسية";
            nameInput.style.display = "block";
            nameInput.required = true;
            submitBtn.innerText = "إنشاء الحساب 📝";
            toggleText.innerText = "لديك حساب بالفعل؟ تسجيل الدخول";
        } else {
            title.innerText = "تسجيل الدخول";
            subtitle.innerText = "أدخل بياناتك للمتابعة إلى منصة المذاكرة";
            nameInput.style.display = "none";
            nameInput.required = false;
            submitBtn.innerText = "دخول 🚀";
            toggleText.innerText = "ليس لديك حساب؟ إنشاء حساب جديد";
        }
    }

    function handleAuth(event) {
        event.preventDefault();
        const email = document.getElementById("auth-email").value.trim();
        const pass = document.getElementById("auth-pass").value;
        const name = document.getElementById("auth-name").value.trim();

        let users = JSON.parse(localStorage.getItem("app_users")) || [];

        if (isSignUpMode) {
            const userExists = users.some(u => u.email === email);
            if (userExists) {
                alert("هذا البريد الإلكتروني مسجل بالفعل!");
                return;
            }
            const newUser = { name, email, pass };
            users.push(newUser);
            localStorage.setItem("app_users", JSON.stringify(users));
            localStorage.setItem("current_user", JSON.stringify(newUser));
            alert("تم إنشاء الحساب بنجاح! 🎉");
        } else {
            const user = users.find(u => u.email === email && u.pass === pass);
            if (!user) {
                alert("البريد الإلكتروني أو كلمة السر غير صحيحة!");
                return;
            }
            localStorage.setItem("current_user", JSON.stringify(user));
        }

        checkAuthStatus();
    }

    function logout() {
        localStorage.removeItem("current_user");
        checkAuthStatus();
    }

    // --- 📚 إدارة التطبيق والجدول ---
    const adviceList = [
        "ضع هاتف في غرفة أخرى أثناء المذاكرة، التركيز ينخفض بنسبة 40% بمجرد وجود الهاتف بجوارك!",
        "استخدم طريقة بومودورو: ذاكر 25 دقيقة بتركيز كامل، ثم خذ استراحة 5 دقائق.",
        "قسّم الدروس الكبيرة إلى أجزاء صغيرة جداً، البدء بأصغر خطوة يكسر حاجز التكاسل.",
        "اشرب كوباً من الماء كل ساعة، الجفاف الخفيف يؤدي إلى تشتت الذاكرة والتعب السريع.",
        "افضل طريقة للتأكد من فهمك لدرس معين هي أن تشرحه لشخص آخر أو لنفسك بصوت عالٍ.",
        "لا تذاكر وأنت مستلقٍ على السرير، افصل تماماً بين مكان النوم ومكان الإنجاز والتركيز.",
        "راجع ما ذاكرته قبل النوم مباشرة ولو لمدة 5 دقائق، فالدماغ يثبت المراجعة الأخيرة أثناء النوم."
    ];

    const defaultSchedule = {
        "الأحد": ["القرآن الكريم", "صرف", "بلاغه", "كيمياء", "فيزياء", "هندسه", "E"],
        "الإثنين": ["القرآن الكريم", "حديث", "توحيد", "نحو", "استاتيكا", "E"],
        "الثلاثاء": ["القرآن الكريم", "فقه شافعي", "تفسير", "ادب", "جبر", "E"],
        "الأربعاء": ["القرآن الكريم", "صرف", "بلاغه", "كيمياء", "هندسه", "E"],
        "الخميس": ["القرآن الكريم", "حديث", "توحيد", "نحو", "فيزياء", "E"],
        "الجمعة": ["القرآن الكريم", "مطالعه ونصوص", "جبر", "حساب مثلثات", "تفاضل", "E"],
        "السبت": ["القرآن الكريم", "فقه شافعي", "تفسير", "ادب", "جبر", "E"]
    };

    let schedule = JSON.parse(localStorage.getItem("custom_schedule_data")) || defaultSchedule;
    const daysList = ["السبت", "الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة"];
    const now = new Date();
    const daysMapJS = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
    const todayName = daysMapJS[now.getDay()];

    function getWeekIdentifier() {
        const date = new Date();
        const startOfYear = new Date(date.getFullYear(), 0, 1);
        const pastDaysOfYear = (date - startOfYear) / 86400000;
        const weekNum = Math.ceil((pastDaysOfYear + startOfYear.getDay() + 1) / 7);
        return `${date.getFullYear()}_W${weekNum}`;
    }

    const currentWeekKey = getWeekIdentifier();
    let selectedDay = todayName;

    function getStorageKey(day) {
        return `tasks_${currentWeekKey}_${day}`;
    }

    function initApp() {
        displayDailyAdvice();
        renderNav();
        renderSubjects();
    }

    function displayDailyAdvice() {
        const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
        const adviceIndex = dayOfYear % adviceList.length;
        document.getElementById("daily-advice-text").innerText = adviceList[adviceIndex];
    }

    function renderNav() {
        const nav = document.getElementById("days-nav");
        nav.innerHTML = "";

        daysList.forEach(day => {
            const btn = document.createElement("button");
            const isToday = day === todayName;
            const savedState = JSON.parse(localStorage.getItem(getStorageKey(day))) || {};
            
            const totalSubjects = schedule[day] ? schedule[day].length : 0;
            let completedCount = 0;
            
            if (schedule[day]) {
                schedule[day].forEach(s => {
                    if (savedState[s] && savedState[s].completed) completedCount++;
                });
            }

            const isDayFinished = totalSubjects > 0 && completedCount === totalSubjects;

            btn.className = `day-btn ${day === selectedDay ? 'active' : ''} ${isToday ? 'is-today' : ''} ${isDayFinished ? 'completed-day' : ''}`;
            let labelBadge = isToday ? "اليوم الحالي" : (isDayFinished ? "مكتمل ✓" : `${completedCount}/${totalSubjects}`);

            btn.innerHTML = `<span>${day}</span><span class="badge">${labelBadge}</span>`;

            btn.onclick = () => {
                selectedDay = day;
                renderNav();
                renderSubjects();
            };

            nav.appendChild(btn);
        });
    }

    function renderSubjects() {
        const container = document.getElementById("subjects-container");
        const titleEl = document.getElementById("selected-day-title");
        const tagEl = document.getElementById("day-status-tag");
        
        titleEl.innerText = `جدول يوم (${selectedDay})`;
        
        if (selectedDay === todayName) {
            tagEl.innerText = "⭐ اليوم الحالي";
            tagEl.className = "status-tag tag-today";
        } else {
            tagEl.innerText = "تصفح / تعديل";
            tagEl.className = "status-tag tag-normal";
        }

        const savedState = JSON.parse(localStorage.getItem(getStorageKey(selectedDay))) || {};
        const subjects = schedule[selectedDay] || [];
        container.innerHTML = "";

        let completedCount = 0;

        subjects.forEach((subject, index) => {
            const itemData = savedState[subject] || {};
            const isCompleted = itemData.completed || false;
            const lessonName = itemData.lesson || "";
            const timeText = itemData.timestamp || "";

            if (isCompleted) completedCount++;

            const card = document.createElement("div");
            card.className = `subject-card ${isCompleted ? 'completed' : ''}`;

            card.innerHTML = `
                <div class="subject-header">
                    <span>📖 ${subject} ${isCompleted ? '✓' : ''}</span>
                </div>
                <div class="inputs-group">
                    <input type="text" id="input-${index}" placeholder="أدخل اسم الدرس..." value="${lessonName}" ${isCompleted ? 'disabled' : ''}>
                    ${isCompleted ? `
                        <button class="btn edit-btn" onclick="enableEdit('${subject}')">تعديل ✏️</button>
                    ` : `
                        <button class="btn finish-btn" onclick="saveSubject(${index}, '${subject}')">تم الانتهاء ✓</button>
                    `}
                </div>
                <div class="time-badge">${isCompleted ? `⏱️ تم الانتهاء في: ${timeText}` : ''}</div>
            `;
            container.appendChild(card);
        });

        updateProgressBar(completedCount, subjects.length);
    }

    function saveSubject(index, subjectName) {
        const input = document.getElementById(`input-${index}`);
        const lesson = input.value.trim();

        if (!lesson) {
            alert("يرجى كتابة اسم الدرس أولاً!");
            return;
        }

        const storageKey = getStorageKey(selectedDay);
        const savedState = JSON.parse(localStorage.getItem(storageKey)) || {};

        const timeStampStr = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        const fullDateStr = new Date().toLocaleString('ar-EG');

        savedState[subjectName] = {
            completed: true,
            lesson: lesson,
            timestamp: timeStampStr,
            fullDate: fullDateStr
        };

        localStorage.setItem(storageKey, JSON.stringify(savedState));
        renderNav();
        renderSubjects();
    }

    function enableEdit(subjectName) {
        const storageKey = getStorageKey(selectedDay);
        const savedState = JSON.parse(localStorage.getItem(storageKey)) || {};

        if (savedState[subjectName]) {
            savedState[subjectName].completed = false;
        }

        localStorage.setItem(storageKey, JSON.stringify(savedState));
        renderNav();
        renderSubjects();
    }

    function updateProgressBar(completed, total) {
        const percentage = total > 0 ? (completed / total) * 100 : 0;
        document.getElementById("progress-bar").style.width = `${percentage}%`;
    }

    // --- 📊 تسليم المهام وشيت البيانات الداخلي ---
    function submitSelectedDayTasks() {
        const storageKey = getStorageKey(selectedDay);
        const savedState = JSON.parse(localStorage.getItem(storageKey)) || {};
        let sheetHistory = JSON.parse(localStorage.getItem("internal_sheet_history")) || [];

        let newEntries = 0;
        for (const [subject, data] of Object.entries(savedState)) {
            if (data.completed) {
                // حفظ المهام في سجل الشيت الداخلي
                sheetHistory.push({
                    day: selectedDay,
                    subject: subject,
                    lesson: data.lesson,
                    time: data.fullDate
                });
                newEntries++;
            }
        }

        if (newEntries === 0) {
            alert(`لم تقم بإنهاء أي مادة بعد في جدول يوم (${selectedDay}) لتسليمها!`);
            return;
        }

        localStorage.setItem("internal_sheet_history", JSON.stringify(sheetHistory));
        alert(`🎉 تم تسليم وحفظ مهام يوم (${selectedDay}) بنجاح داخل شيت الصفحة!`);
    }

    function openInternalSheetModal() {
        const container = document.getElementById("sheet-table-container");
        const sheetHistory = JSON.parse(localStorage.getItem("internal_sheet_history")) || [];

        if (sheetHistory.length === 0) {
            container.innerHTML = "<p style='text-align:center; color:#64748b; padding:20px;'>لا توجد مهام مسلّمة في الشيت حتى الآن.</p>";
        } else {
            let tableHTML = `
                <table class="sheet-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>اليوم</th>
                            <th>المادة</th>
                            <th>الدرس</th>
                            <th>تاريخ ووقت التسليم</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            sheetHistory.forEach((item, index) => {
                tableHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td><b>${item.day}</b></td>
                        <td>${item.subject}</td>
                        <td>${item.lesson}</td>
                        <td>${item.time}</td>
                    </tr>
                `;
            });

            tableHTML += "</tbody></table>";
            container.innerHTML = tableHTML;
        }

        document.getElementById("sheet-modal-overlay").style.display = "flex";
    }

    function closeInternalSheetModal() {
        document.getElementById("sheet-modal-overlay").style.display = "none";
    }

    function clearSheetHistory() {
        if (confirm("هل أنت تأكد من تفريغ كافة بيانات السجل والشيت؟")) {
            localStorage.removeItem("internal_sheet_history");
            openInternalSheetModal();
        }
    }

    // --- ⚙️ نافذة تعديل الجدول ---
    function openScheduleModal() {
        document.getElementById("modal-title").innerText = `تعديل حصص يوم (${selectedDay})`;
        const listContainer = document.getElementById("modal-subjects-list");
        listContainer.innerHTML = "";

        const currentSubjects = schedule[selectedDay] || [];
        currentSubjects.forEach((sub) => {
            addSubjectRowInput(sub);
        });

        document.getElementById("modal-overlay").style.display = "flex";
    }

    function closeScheduleModal() {
        document.getElementById("modal-overlay").style.display = "none";
    }

    function addSubjectRowInput(value = "") {
        const listContainer = document.getElementById("modal-subjects-list");
        const row = document.createElement("div");
        row.className = "edit-subject-row";
        row.innerHTML = `
            <input type="text" class="modal-subject-input" value="${value}" placeholder="اسم المادة...">
            <button class="btn-delete" onclick="this.parentElement.remove()">حذف</button>
        `;
        listContainer.appendChild(row);
    }

    function addNewSubjectRow() {
        addSubjectRowInput("");
    }

    function saveCustomSchedule() {
        const inputs = document.querySelectorAll(".modal-subject-input");
        const newSubjects = [];
        inputs.forEach(input => {
            const val = input.value.trim();
            if (val) newSubjects.push(val);
        });

        schedule[selectedDay] = newSubjects;
        localStorage.setItem("custom_schedule_data", JSON.stringify(schedule));
        
        closeScheduleModal();
        renderNav();
        renderSubjects();
    }

    // التحقق من حالة الدخول عند بدء التشغيل
    checkAuthStatus();
</script>

</body>
</html>
